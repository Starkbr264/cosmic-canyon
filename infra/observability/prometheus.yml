# Metricas da API. O endpoint /actuator/prometheus so existe com
# management.endpoints.web.exposure.include=prometheus; sem isso o scrape
# recebe 404 e o Grafana mostra "no data", que e o sintoma classico de
# prometheus.yml desatualizado.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    stack: tradewind-fullstack

scrape_configs:
  - job_name: tradewind-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: api
          env: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
