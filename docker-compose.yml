# Stack local completa do sistema de vendas internacional.
#
# Perfis (compose --profile <nome> up):
#   (sem perfil)  postgres ......... banco, com volume e healthcheck
#   app           api + web ....... a aplica��ao inteira em containers
#   cache         redis ........... cache e filas; a API so o usa se REDIS_HOST existir
#   storage       objectstore + init ... object storage S3-compativel (imagens, relatorios, backups)
#   obs           prometheus + grafana ... metricas da API
#   tools         pgadmin ......... GUI do banco
#
# Motivo de o compose nao ser a unica forma de rodar: o mesmo build de imagem
# roda em Fly.io, DigitalOcean ou um VPS. O compose orquestra o ambiente local,
# nao a implantacao.

name: tradewind-fullstack

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradewind-postgres
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradewind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradewind_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tradewind}
      # Deixa o initdb do container usar o mesmo timezone do host
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Scripts executados só na primeira criação do volume
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradewind} -d ${POSTGRES_DB:-tradewind}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - tradewind

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tradewind-backend:${APP_VERSION:-latest}
    container_name: tradewind-api
    restart: unless-stopped
    logging: *logging
    profiles: ["app"]
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tradewind}
      POSTGRES_USER: ${POSTGRES_USER:-tradewind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradewind_dev}
      # Origem do browser. A API fala com o Postgres pela rede interna, mas quem
      # chama a API e o navegador do usuario, que nao alcanca o nome `api`.
      API_CORS_ALLOWED_ORIGINS: ${API_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-tradewind-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    # A imagem ja define HEALTHCHECK; o Compose so aproveita para o `web`.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - tradewind

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    image: tradewind-web:${APP_VERSION:-latest}
    container_name: tradewind-web
    restart: unless-stopped
    logging: *logging
    profiles: ["app"]
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      # Valor embutido no build (NEXT_PUBLIC_*). Aqui so o runtime do Next.
      PORT: 3000
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tradewind

  redis:
    image: redis:7-alpine
    container_name: tradewind-redis
    restart: unless-stopped
    logging: *logging
    profiles: ["cache"]
    # --save "" desliga a persistencia: cache e fila nao podem custar disco
    # nem ficar inconsistentes depois de um restart. O que importa esta no
    # Postgres, que e a fonte da verdade.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - tradewind

  # Object storage S3-compativel para o ambiente local.
  #
  # RustFS e a alternativa ao MinIO depois que as imagens `minio/minio` e
  # `minio/mc` sairam do Docker Hub (pull devolve 404 em 2026). A API fala S3,
  # entao trocar o servidor no Compose e a unica diferenca; em producao o alvo
  # continua sendo R2 ou S3, nao este container.
  objectstore:
    image: rustfs/rustfs:latest
    container_name: tradewind-objectstore
    restart: unless-stopped
    logging: *logging
    profiles: ["storage"]
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-tradewindstorage}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-tradewindstorage123}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - objectstore-data:/data
    healthcheck:
      # O caminho e do MinIO de proposito: o RustFS expoe o mesmo, e assim a
      # config continua valendo se o servico voltar a ser o MinIO.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - tradewind

  objectstore-init:
    image: amazon/aws-cli:2.31.0
    container_name: tradewind-objectstore-init
    profiles: ["storage"]
    logging: *logging
    depends_on:
      objectstore:
        condition: service_healthy
    # Cria os buckets uma vez e sai. Nenhum bucket e publico por policy: a
    # entrega e por URL assinada, o que permite revogar acesso sem reescrever
    # regra nem expor o bucket inteiro.
    entrypoint: >
      /bin/sh -c "
      set -e;
      aws --endpoint-url http://objectstore:9000 s3 mb s3://$${S3_BUCKET} || true;
      aws --endpoint-url http://objectstore:9000 s3 mb s3://$${S3_BUCKET}-backups || true;
      aws --endpoint-url http://objectstore:9000 s3 ls;
      "
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-tradewindstorage}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-tradewindstorage123}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-tradewind-media}
    networks:
      - tradewind

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: tradewind-prometheus
    restart: unless-stopped
    logging: *logging
    profiles: ["obs"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    networks:
      - tradewind

  grafana:
    image: grafana/grafana:12.0.1
    container_name: tradewind-grafana
    restart: unless-stopped
    logging: *logging
    profiles: ["obs"]
    ports:
      - "${GRAFANA_PORT:-3030}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-tradewind_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - tradewind

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: tradewind-pgadmin
    restart: unless-stopped
    logging: *logging
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@tradewind.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-tradewind_dev}
      PGADMIN_CONFIG_SERVER_MODE: False
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - tradewind

volumes:
  postgres-data:
  pgadmin-data:
  objectstore-data:
  prometheus-data:
  grafana-data:

networks:
  tradewind:
    driver: bridge
