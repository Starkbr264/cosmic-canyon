name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes + contrato)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradewind
          POSTGRES_PASSWORD: tradewind_dev
          POSTGRES_DB: tradewind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradewind -d tradewind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Instala JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Unitarios: Mockito, sem Docker e sem banco. Roda em segundos.
      - name: Testes unitarios (Mockito)
        working-directory: backend
        run: ./mvnw -B test

      # Integracao: Postgres real via Testcontainers (usa o Docker do runner).
      - name: Testes de integracao (Testcontainers)
        working-directory: backend
        run: ./mvnw -B verify -Pintegration

      - name: Build do jar
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      # Exporta o OpenAPI de uma instancia real, com banco migrado.
      - name: Exporta OpenAPI
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: local
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: tradewind_test
          POSTGRES_USER: tradewind
          POSTGRES_PASSWORD: tradewind_dev
        run: |
          nohup java -jar target/tradewind-backend.jar > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "API no ar"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8080/actuator/health || { cat /tmp/api.log; exit 1; }
          mkdir -p ../docs/postman
          curl -sf http://localhost:8080/v3/api-docs -o ../docs/postman/openapi.json
          cat /tmp/api.log

      # Falha o build se o contrato versionado estiver desatualizado:
      # alguem mudou a API e nao commitou o openapi.json.
      - name: Verifica contrato OpenAPI atualizado
        run: |
          if ! git diff --quiet -- docs/postman/openapi.json; then
            echo "::error::docs/postman/openapi.json esta desatualizado."
            git --no-pager diff -- docs/postman/openapi.json
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/postman/openapi.json
          if-no-files-found: error

  frontend:
    name: Frontend (build + tipos)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  docker:
    name: Imagem do backend
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: tradewind-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
